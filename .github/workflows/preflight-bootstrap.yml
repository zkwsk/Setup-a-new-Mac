name: Bootstrap Preflight

on:
  push:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Apple Silicon runner
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "Expected arm64 runner, got: $arch"
            exit 1
          fi

      - name: Ensure Xcode Command Line Tools
        run: |
          if ! xcode-select -p >/dev/null 2>&1; then
            echo "Xcode Command Line Tools are required but not installed."
            exit 1
          fi
          xcode-select -p

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run bootstrap preflight
        # CI is set, so this installs no sudoers rule and draws no wizard.
        run: ./bootstrap.sh --preflight-only
